<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM Demo - Template Web App</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23fff'/%3E%3C/svg%3E" type="image/svg+xml">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @view-transition {
      navigation: auto;
    }
    
    nav a[aria-current="page"]:after {
      border-color: white;
      view-transition-name: posts-nav;
    }
    
    ::view-transition-old(posts-nav) {
      animation: fade 0.2s linear forwards;
      height: 100%;
    }
    
    ::view-transition-new(posts-nav) {
      animation: fade 0.3s linear reverse;
      height: 100%;
    }
    
    @keyframes fade {
      from { opacity: 1; }
      to { opacity: 0; }
    }
  </style>
  <script>
    // Only use if browser supports View Transitions
    if (document.startViewTransition) {
      window.addEventListener('click', (e) => {
        // Only handle internal links
        if (e.target.tagName === 'A' && e.target.origin === window.location.origin) {
          e.preventDefault();
          document.startViewTransition(() => {
            window.location.href = e.target.href;
          });
        }
      });
    }
  </script>
</head>
<body class="font-mono p-8 bg-gray-50">
  <div class="max-w-4xl mx-auto">
    <header class="mb-8">
      <h1 class="text-3xl font-bold text-blue-600 mb-4">Template Web App</h1>
      <nav class="bg-blue-600 text-white p-4 rounded-lg mb-4">
        <a href="../index.html" class="mr-6 hover:underline">Home</a>
        <a href="llm.html" class="mr-6 hover:underline font-bold relative" aria-current="page">
          LLM Demo
          <span class="absolute bottom-0 left-0 w-full h-0.5 bg-white"></span>
        </a>
      </nav>
      <div class="bg-blue-100 border-l-4 border-blue-500 p-4 mb-6">
        <p class="text-sm text-blue-700">This page demonstrates running a local LLM in the browser using Transformers.js.</p>
      </div>
    </header>
    
    <div class="bg-white p-6 rounded-lg shadow-md mb-8">
      <div class="max-w-4xl mx-auto p-4 bg-gray-900 text-gray-200 rounded-lg">
        <h2 class="text-xl font-semibold mb-3 text-gray-200">Gemma 3 270M (ONNX) – Vanilla JS</h2>
  
        <div id="chat" class="mb-4"></div>
  
        <div class="flex gap-2 my-4">
          <textarea id="prompt" placeholder="Ask something…" class="flex-1 min-h-20 p-3 rounded-lg border border-gray-600 bg-gray-800 text-gray-200 placeholder-gray-400 resize-none focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
          <button id="send" class="px-4 py-3 rounded-lg border border-gray-600 bg-gray-700 text-gray-200 hover:bg-gray-600 disabled:opacity-60 disabled:cursor-not-allowed transition-colors">Send</button>
        </div>
        <div class="flex gap-2 items-center mt-4">
          <button id="clear" class="px-4 py-2 rounded-lg border border-gray-600 bg-gray-700 text-gray-200 hover:bg-gray-600 transition-colors">Clear</button>
          <span id="status" class="text-xs text-gray-400"></span>
        </div>
        <div id="progress-container" class="w-full bg-gray-600 rounded my-2 overflow-hidden" style="display: none;">
          <div id="progress-bar" class="h-2 bg-blue-500 rounded transition-all duration-300 ease-out" style="width: 0%;"></div>
          <div id="progress-text" class="text-xs text-gray-400 mt-1"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { pipeline, TextStreamer, env } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers";

    // Keep downloads remote and cached by the browser (recommended for a quick demo)
    env.allowLocalModels = false;

    const statusEl = document.getElementById("status");
    const sendBtn  = document.getElementById("send");
    const clearBtn = document.getElementById("clear");
    const promptEl = document.getElementById("prompt");
    const chatEl   = document.getElementById("chat");
    const progressContainer = document.getElementById("progress-container");
    const progressBar = document.getElementById("progress-bar");
    const progressText = document.getElementById("progress-text");

    // Basic chat history (system + turns)
    const messages = [
      { role: "system", content: "You are a helpful, concise assistant." }
    ];

    // Progress callback for model loading
    function onProgress(progress) {
      console.log('Progress update:', progress); // Debug log
      
      // Show progress container when any progress event occurs
      progressContainer.style.display = 'block';
      
      if (progress.status === 'downloading' || progress.status === 'progress') {
        if (progress.loaded && progress.total) {
          const percentage = Math.round((progress.loaded / progress.total) * 100);
          progressBar.style.width = `${percentage}%`;
          const loadedMB = (progress.loaded / 1024 / 1024).toFixed(1);
          const totalMB = (progress.total / 1024 / 1024).toFixed(1);
          const fileName = progress.file || progress.name || 'model file';
          progressText.textContent = `Downloading ${fileName}: ${percentage}% (${loadedMB}MB / ${totalMB}MB)`;
        } else {
          progressText.textContent = `Downloading ${progress.file || progress.name || 'model files'}...`;
        }
      } else if (progress.status === 'loading' || progress.status === 'initiate') {
        progressText.textContent = `Loading ${progress.file || progress.name || 'model'}...`;
      } else if (progress.status === 'done' || progress.status === 'ready') {
        // Don't hide progress or show success message here - let the main loading handle it
        progressText.textContent = `Finalizing ${progress.file || progress.name || 'model'}...`;
      } else {
        // Handle any other progress events
        progressText.textContent = `${progress.status || 'Loading'}...`;
      }
    }

    // Helper to add chat bubbles
    function addBubble(role, text, isMuted = false) {
      const row = document.createElement("div"); 
      row.className = "flex gap-3 items-start my-3";
      
      const r = document.createElement("div"); 
      r.className = "flex-none w-20 text-xs uppercase tracking-wide opacity-70";
      r.textContent = role;
      
      const b = document.createElement("div"); 
      b.className = `flex-1 whitespace-pre-wrap leading-relaxed bg-gray-800 border border-gray-600 rounded-xl p-3 ${isMuted ? 'opacity-70' : ''}`;
      b.textContent = text;
      
      row.append(r, b); 
      chatEl.appendChild(row);
      return b;
    }

    // Prefer WebGPU (faster). Fall back to WASM.
    const device = (navigator.gpu) ? "webgpu" : "wasm";
    const dtype = (device === "webgpu") ? "fp16" : "q4";

    let generator;

    statusEl.textContent = `Loading model (device: ${device}, dtype: ${dtype})…`;
    progressContainer.style.display = 'block';
    progressText.textContent = 'Initializing model download...';

    try {
      generator = await pipeline(
        "text-generation",
        "onnx-community/gemma-3-270m-it-ONNX",
        { device, dtype, progress_callback: onProgress }
      );

      statusEl.textContent = "Ready";
      progressContainer.style.display = 'none';
    } catch (error) {
      console.error('Error loading model:', error);
      statusEl.textContent = "Error loading model";
      progressContainer.style.display = 'none';
      progressText.textContent = `Error: ${error.message}`;
    }

    async function generate() {
      const userText = promptEl.value.trim();
      if (!userText || !generator) return;

      addBubble("User", userText);
      messages.push({ role: "user", content: userText });

      const outBubble = addBubble("Assistant", "");

      sendBtn.disabled = true;
      statusEl.textContent = "Generating…";

      const streamer = new TextStreamer(generator.tokenizer, {
        skip_prompt: true,
        skip_special_tokens: true,
        callback_function: (text) => { outBubble.textContent += text; }
      });

      try {
        const output = await generator(messages, {
          max_new_tokens: 256,
          do_sample: false,
          streamer
        });

        const finalMsg = output[0].generated_text.at(-1)?.content ?? outBubble.textContent;
        outBubble.textContent = finalMsg;
        messages.push({ role: "assistant", content: finalMsg });
      } catch (err) {
        outBubble.textContent = `❌ Error: ${err?.message || err}`;
        console.error(err);
      } finally {
        sendBtn.disabled = false;
        statusEl.textContent = "";
        promptEl.value = "";
        promptEl.focus();
      }
    }

    sendBtn.addEventListener("click", generate);
    promptEl.addEventListener("keydown", (e) => (e.key === "Enter" && (e.ctrlKey || e.metaKey)) ? generate() : null );
    clearBtn.addEventListener("click", () => { chatEl.innerHTML = ""; messages.splice(1); });

  </script>
</body>
</html>
