<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TTS Demo - Template Web App</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23fff'/%3E%3C/svg%3E" type="image/svg+xml">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @view-transition {
      navigation: auto;
    }
    
    nav a[aria-current="page"]:after {
      border-color: white;
      view-transition-name: posts-nav;
    }
    
    ::view-transition-old(posts-nav) {
      animation: fade 0.2s linear forwards;
      height: 100%;
    }
    
    ::view-transition-new(posts-nav) {
      animation: fade 0.3s linear reverse;
      height: 100%;
    }
    
    @keyframes fade {
      from { opacity: 1; }
      to { opacity: 0; }
    }
  </style>
  <script>
    // Only use if browser supports View Transitions
    if (document.startViewTransition) {
      window.addEventListener('click', (e) => {
        // Only handle internal links
        if (e.target.tagName === 'A' && e.target.origin === window.location.origin) {
          e.preventDefault();
          document.startViewTransition(() => {
            window.location.href = e.target.href;
          });
        }
      });
    }
  </script>
</head>
<body class="font-mono p-8 bg-gray-50">
  <div class="max-w-4xl mx-auto">
    <header class="mb-8">
      <h1 class="text-3xl font-bold text-blue-600 mb-4">Template Web App</h1>
      <nav class="bg-blue-600 text-white p-4 rounded-lg mb-4">
        <a href="../index.html" class="mr-6 hover:underline">Home</a>
        <a href="llm.html" class="mr-6 hover:underline">LLM Demo</a>
        <a href="tts.html" class="mr-6 hover:underline font-bold relative" aria-current="page">
          TTS Demo
          <span class="absolute bottom-0 left-0 w-full h-0.5 bg-white"></span>
        </a>
      </nav>
      <div class="bg-blue-100 border-l-4 border-blue-500 p-4 mb-6">
        <p class="text-sm text-blue-700">This page demonstrates running local Text-to-Speech in the browser using kokoro-js.</p>
      </div>
    </header>
    
    <div class="bg-white p-6 rounded-lg shadow-md mb-8">
      <div id="tts-container">
        <div class="max-w-4xl mx-auto p-6 bg-white rounded-lg shadow-lg">
          <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Text-to-Speech Demo</h2>

          <div class="space-y-4">
            <div>
              <label for="tts-text" class="block text-sm font-medium text-gray-700 mb-2">
                Enter text to convert to speech:
              </label>
              <textarea
                id="tts-text"
                class="w-full p-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                rows="4"
                placeholder="Type or paste your text here..."
              >Hello — this is a short demo text for testing Text-to-Speech. Replace it with your own text.</textarea>
            </div>

            <div>
              <label for="voice-select" class="block text-sm font-medium text-gray-700 mb-2">
                Select Voice:
              </label>
              <select
                id="voice-select"
                class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500"
              >
                <!-- Options will be populated by JS -->
              </select>
            </div>

            <button
              id="generate-speech"
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-md transition duration-300"
              type="button"
            >
              Generate Speech
            </button>

            <div id="tts-status" class="text-center text-sm"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { TTSEngine, TTSUI } from '../src/components/tts.js';

    (async () => {
      // Container where the UI will be rendered
      const container = document.getElementById('tts-container');

      // Create the TTS engine with a voice id (constructor expects a string)
      const ttsEngine = new TTSEngine('af_heart');

      // Try to initialize the engine (best-effort). Failures won't prevent the UI from rendering.
      try {
        await ttsEngine.initialize(
          (progress) => {
            // If the UI is already rendered, update status element
            const status = container.querySelector('#tts-status');
            if (status && progress && progress.message) status.textContent = progress.message;
          },
          (err) => {
            const status = container.querySelector('#tts-status');
            if (status) status.textContent = String(err);
          }
        );
      } catch (e) {
        // swallow - initialization is optional for UI to appear
        console.warn('TTS initialization error:', e);
      }

      // Create and render the UI correctly (TTSUI expects the engine as its only constructor arg)
      const ttsUI = new TTSUI(ttsEngine);
      ttsUI.render(container);
    })();
  </script>
</body>
</html>
