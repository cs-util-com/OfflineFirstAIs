<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TTS Demo - Template Web App</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23fff'/%3E%3C/svg%3E" type="image/svg+xml">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @view-transition {
      navigation: auto;
    }
    
    nav a[aria-current="page"]:after {
      border-color: white;
      view-transition-name: posts-nav;
    }
    
    ::view-transition-old(posts-nav) {
      animation: fade 0.2s linear forwards;
      height: 100%;
    }
    
    ::view-transition-new(posts-nav) {
      animation: fade 0.3s linear reverse;
      height: 100%;
    }
    
    @keyframes fade {
      from { opacity: 1; }
      to { opacity: 0; }
    }
  </style>
  <script>
    // Only use if browser supports View Transitions
    if (document.startViewTransition) {
      window.addEventListener('click', (e) => {
        // Only handle internal links
        if (e.target.tagName === 'A' && e.target.origin === window.location.origin) {
          e.preventDefault();
          document.startViewTransition(() => {
            window.location.href = e.target.href;
          });
        }
      });
    }
  </script>
</head>
<body class="font-mono p-8 bg-gray-50">
  <div class="max-w-4xl mx-auto">
    <header class="mb-8">
      <h1 class="text-3xl font-bold text-blue-600 mb-4">Template Web App</h1>
      <nav class="bg-blue-600 text-white p-4 rounded-lg mb-4">
        <a href="../index.html" class="mr-6 hover:underline">Home</a>
        <a href="llm.html" class="mr-6 hover:underline">LLM Demo</a>
        <a href="tts.html" class="mr-6 hover:underline font-bold relative" aria-current="page">
          TTS Demo
          <span class="absolute bottom-0 left-0 w-full h-0.5 bg-white"></span>
        </a>
      </nav>
      <div class="bg-blue-100 border-l-4 border-blue-500 p-4 mb-6">
        <p class="text-sm text-blue-700">This page demonstrates running local Text-to-Speech in the browser using kokoro-js.</p>
      </div>
    </header>
    
    <div class="bg-white p-6 rounded-lg shadow-md mb-8">
      <div id="tts-container"></div>
    </div>
  </div>

  <script type="module">
    import { TTSEngine, TTSUI } from '../src/components/tts.js';

    // Initialize the TTS engine
    const ttsEngine = new TTSEngine({
      defaultVoice: "af_heart"
    });

    // Create the UI
    const container = document.getElementById('tts-container');
    const ttsUI = new TTSUI(container, ttsEngine);
  </script>
</body>
</html>
